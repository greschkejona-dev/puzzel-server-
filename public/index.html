<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Puzzly</title>
<style>
:root{--bg:#15152a;--sf:#222246;--tx:#ecebff;--mu:#9a98c8;--ac:#ffc857;--ak:#15152a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eeedf8;--sf:#fff;--tx:#1b1a2e;--mu:#5d5b86;--ac:#c9840c;--ak:#fff}}
:root[data-theme="light"]{--bg:#eeedf8;--sf:#fff;--tx:#1b1a2e;--mu:#5d5b86;--ac:#c9840c;--ak:#fff}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem .9rem;background:var(--sf)}
b{font-size:1.3rem;letter-spacing:-.03em;margin-right:.4rem}
button,select,.bt{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--mu);border-radius:10px;padding:.4rem .8rem;cursor:pointer}
.p{background:var(--ac);color:var(--ak);border-color:var(--ac);font-weight:600}
button:focus-visible,select:focus-visible,.bt:focus-within{outline:2px solid var(--ac);outline-offset:2px}
#st{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums}
input[type=color]{width:1.5rem;height:1.5rem;border:0;padding:0;background:none;vertical-align:middle}
#nm{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--mu);border-radius:10px;padding:.35rem .6rem;width:7rem}
@media(max-width:700px){header{padding:.4rem .6rem;gap:.4rem}b{font-size:1.1rem}#st{font-size:.85rem}}
#bl{position:fixed;inset:0;display:grid;place-items:center;background:#000a}#bl[hidden]{display:none}#bl div{background:var(--sf);padding:1.2rem 1.6rem;border-radius:10px;max-width:92%;max-height:80%;overflow:auto}#bo{padding-left:1.2rem;margin:.5rem 0}#bn{color:var(--mu);font-size:.85rem}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#win div{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}@media(prefers-reduced-motion:reduce){#win div{animation:none}}
.ic{position:relative;display:inline-flex;align-items:center;font:inherit;font-size:1.15rem;line-height:1;padding:.3rem .5rem;border:1px solid var(--mu);border-radius:10px;background:transparent;color:var(--tx);cursor:pointer}
#bgl input{position:absolute;opacity:0;width:1px;height:1px;left:50%;bottom:0}
.dly{position:relative;background:linear-gradient(135deg,#ff7a59,#ffc857);color:#1b1a2e;border:0;font-weight:700}
.dly.new::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#3ddc84}
.dm header{box-shadow:inset 0 -3px 0 #ffc857}
#pc{font-weight:700;color:#f5b301;white-space:nowrap}#pi{font-style:normal;filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.1)}
#mn{flex:1;position:relative;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
header{position:relative;z-index:5}
.rail{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.5rem;align-items:center;padding:.5rem;background:var(--sf);border-radius:14px;z-index:4;max-height:96%}
.rail select{width:3.6rem;padding:.3rem .2rem;text-align:center}
#lf{position:absolute;right:calc(100% + 8px);top:0;display:flex;gap:.4rem;background:var(--sf);padding:.4rem;border-radius:12px}#lf[hidden]{display:none}
.av{width:2.4rem;height:2.4rem;border-radius:50%;font-size:1.3rem;line-height:1;padding:0;border:2px solid #f5b301;background:var(--sf);cursor:pointer}
#pp{position:absolute;top:.5rem;right:.6rem;background:var(--sf);padding:.7rem;border-radius:12px;z-index:6;display:grid;gap:.5rem;width:13rem}#pp[hidden]{display:none}#ag{display:flex;flex-wrap:wrap;gap:.3rem}#nm{width:100%;box-sizing:border-box}
.tip,.tipb{position:relative}
.tip::before,.tipb::before{content:attr(data-tip);position:absolute;white-space:nowrap;background:var(--ac);color:var(--ak);font:700 .8rem/1 system-ui,sans-serif;padding:.45rem .7rem;border-radius:8px;opacity:0;pointer-events:none;z-index:9;transition:opacity .06s}
.tip::before{right:calc(100% + 12px);top:50%;transform:translateY(-50%)}.tipb::before{top:calc(100% + 10px);right:0}
.tip:hover::before,.tipb:hover::before{opacity:1}
@media(hover:none){.tip::before,.tipb::before{display:none}}
#hint{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sf);color:var(--mu);padding:.5rem .9rem;border-radius:10px;pointer-events:none;text-align:center;max-width:90%}
#win{position:fixed;inset:0;display:grid;place-items:center;background:#000a}
#win[hidden]{display:none}
#win div{background:var(--sf);padding:1.6rem 2rem;border-radius:10px;text-align:center}
h2{margin:0 0 .4rem}
.ic,.rail select{box-sizing:border-box;width:2.6rem;height:2.6rem;padding:0;justify-content:center;font-size:1.2rem}
.rail select{font-size:.95rem;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none}
.rail{top:0;bottom:0;right:0;transform:none;border-radius:0;justify-content:center;padding:.5rem .6rem}
@media(max-height:620px){.ic,.rail select{width:2.2rem;height:2.2rem}}
#mnu{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 30% 20%,#2b3a67,#12151f);color:#fff;padding:16px;overflow:auto}
#mnu[hidden],#rmb[hidden],#npn[hidden]{display:none}
#mnu h1{margin:0 0 8px;font-size:2.4rem}
#mnu .mb{width:min(340px,90vw);padding:14px 16px;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:1.05rem;text-align:left;cursor:pointer}
#mnu .mb:hover:not(:disabled){background:rgba(255,255,255,.22)}#mnu .mb:disabled{opacity:.45;cursor:default}
#mnu .mr{display:flex;gap:8px;width:min(340px,90vw)}#mnu .mr .mb{width:auto;flex:2}
#mnu input,#mnu select{flex:1;padding:10px;border-radius:10px;border:0;font-size:1rem;min-width:0;text-transform:uppercase}
#mnu select{background:#fff;color:#111}
#mnE{color:#ffb4b4;min-height:1.2em;font-size:.95rem}
#rmb{position:fixed;right:5rem;top:4.2rem;z-index:20;background:var(--sf);color:var(--tx);border-radius:12px;padding:.5rem .7rem;min-width:190px;box-shadow:0 2px 12px #0006}
#rmh2{display:flex;align-items:center;gap:.3rem;margin-bottom:.3rem}#rmb .ic{width:2rem;height:2rem;font-size:1rem}#rmt{margin-right:auto;letter-spacing:.12em}
#rmp .rr{display:flex;align-items:center;gap:.5rem;padding:2px 0}#rmp i{width:.8rem;height:.8rem;border-radius:50%;flex:none}#rmp span{flex:1}#rmp b{font-size:1rem;letter-spacing:0;padding-left:.8rem;margin:0}
#npn{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#000a}#npn div{background:var(--sf);padding:1.2rem 1.6rem;border-radius:10px;display:flex;flex-direction:column;gap:.7rem;max-width:92%}#npn div div{padding:0;background:none;flex-direction:row;gap:.5rem}#npn h2,#npn p{margin:0}
#bgp{position:absolute;right:4.8rem;top:12rem;background:var(--sf);padding:.8rem;border-radius:12px;z-index:6;display:flex;flex-direction:column;gap:.6rem;width:12rem;box-shadow:0 2px 12px #0006}#bgd{height:1.6rem;border-radius:8px;border:1px solid var(--mu)}#bgp[hidden]{display:none}#bgp button{width:2rem;height:2rem;padding:0;border-radius:50%}#bgp input{grid-column:1/-1;width:100%;height:2rem;border:0;padding:0;background:none;cursor:pointer}
#ac{display:flex;flex-wrap:wrap;gap:.3rem}#ac button{width:1.6rem;height:1.6rem;padding:0;border-radius:50%}
#pod,#bpod{display:flex;align-items:flex-end;justify-content:center;gap:.5rem;margin:.8rem 0}#pod .pc,#bpod .pc{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:5.5rem}#pod .pb,#bpod .pb{width:100%;display:grid;place-items:center;border-radius:8px 8px 0 0;font-size:1.6rem}#pod b,#bpod b{font-size:.95rem;margin:0;letter-spacing:0}
#bl div div{padding:0;background:none;max-width:none;max-height:none;overflow:visible;border-radius:0}#bl>div{min-width:min(380px,92vw)}#bo{padding:0}#bt{display:flex;gap:.5rem;margin:.4rem 0 .8rem}#bl h2{margin:.2rem 0}
.lr{display:grid;grid-template-columns:2rem 2rem 1fr auto;align-items:center;gap:.5rem;padding:.4rem .2rem;border-top:1px solid #8883}.lr .rk{color:var(--mu);text-align:right}.lr .lv{margin:0;font-size:1rem;letter-spacing:0;font-variant-numeric:tabular-nums}
#bgp input[type=range]{grid-column:1/-1;width:100%;height:.9rem;margin:.3rem 0;padding:0;border:0;border-radius:999px;-webkit-appearance:none;appearance:none;cursor:pointer}
#bgp #bgh{border:1px solid var(--mu);background:linear-gradient(90deg,hsl(0 60% 55%),hsl(60 60% 55%),hsl(120 60% 55%),hsl(180 60% 55%),hsl(240 60% 55%),hsl(300 60% 55%),hsl(360 60% 55%))}#bgp #bgv{border:1px solid var(--mu);background:linear-gradient(90deg,#000,#fff)}
#bgp input::-webkit-slider-thumb{-webkit-appearance:none;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--ac);border:2px solid #fff}#bgp input::-moz-range-thumb{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--ac);border:2px solid #fff}
html,body{height:100dvh;overflow:hidden}
.rail{justify-content:flex-start!important;padding:.7rem .6rem!important;border-left:1px solid #8884;gap:.45rem}
header{background:linear-gradient(90deg,var(--sf) 55%,color-mix(in srgb,var(--ac) 16%,var(--sf)));border-bottom:1px solid #8884}
#lgo{font-size:1.55rem;letter-spacing:-.04em;background:linear-gradient(135deg,#ff7a59,var(--ac));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;user-select:none}#lgo::before{content:'🧩 ';-webkit-text-fill-color:initial}
.ic{transition:transform .12s,background .12s}.ic:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--ac) 18%,transparent)}
#ctx{position:fixed;z-index:80;background:var(--sf);border-radius:10px;padding:.3rem;display:flex;flex-direction:column;gap:.2rem;box-shadow:0 4px 16px #0008}#ctx[hidden]{display:none}#ctx button{border:0;text-align:left}
</style></head><body>
<header><b id="lgo" style="cursor:pointer" title="Menü">puzzly</b><button id="dl" class="dly tipb">📅 Daily</button><button class="ic tipb" id="bb">🏆</button><span id="st"></span><span id="pc"><i id="pi">🧩</i> <span id="pt">0</span></span><button id="pf" class="av tipb">🦊</button></header>
<main id="mn"><canvas id="c"></canvas><nav class="rail"><div class="tip" id="nw"><select id="n"></select></div><button class="ic tip" id="go">🔀</button><button class="ic tip" id="rs">🔄</button><label class="ic tip" id="fl">🖼️<input type="file" id="f" accept="image/*" hidden></label><button class="ic tip" id="gh">💡</button><button class="ic tip" id="sn">🔊</button><button class="ic tip" id="bgl">🎨</button><div class="tip" id="lw"><button class="ic" id="lgb">🇩🇪</button><div id="lf" hidden></div></div></nav>
<div id="bgp" hidden><div id="bgd"></div><input type="color" id="bg" value="#15152a" hidden><input type="range" id="bgh" min="0" max="360" value="240" aria-label="Farbton"><input type="range" id="bgv" min="8" max="96" value="12" aria-label="Helligkeit"></div><div id="pp" hidden><input id="nm" maxlength="14"><div id="ag"></div><div id="ac"></div><select id="av" hidden></select></div></main>
<div id="hint">Teile ziehen. Rechtsklick gedrückt halten zeigt das Hilfsbild. Mausrad oder zwei Finger zoomen.</div>
<div id="win" hidden><div><h2 id="wh">Geschafft!</h2><p id="wt"></p><div id="pod"></div><button class="p" id="again">Nochmal</button></div></div>
<div id="bl" hidden><div><h2>🏆</h2><div id="bt"><button id="bt0" class="bt" data-n="tabd">📅 Daily</button><button id="bt1" class="bt" data-n="tabt">🧩 Gesamt</button></div><div id="bpod"></div><div id="bo"></div><p id="bn"></p><button class="p" id="bx">Schließen</button></div></div><canvas id="cf" hidden></canvas>
<div id="mnu"><h1>🧩 Puzzly</h1>
<button class="mb" id="mnD" data-n="daily">📅 Daily</button>
<button class="mb" id="mnF" data-n="free">🧩 Freies Puzzle</button>
<button class="mb" id="mnX" data-n="duel">⚔️ Duell: zufälliger Gegner</button>
<div class="mr"><select id="mnN"><option>48</option><option selected>100</option><option>250</option><option>500</option></select><button class="mb" id="mnR" data-n="room">👥 Raum erstellen</button></div>
<div class="mr"><input id="mnC" maxlength="4" placeholder="Code"><button class="mb" id="mnJ" data-n="join">Beitreten</button></div>
<button class="mb" id="mnB" data-n="board">🏆 Bestenliste</button><div id="mnE"></div></div>
<div id="rmb" hidden><div id="rmh2"><b id="rmt"></b><button class="ic" id="rmc" title="Link kopieren">🔗</button><button class="ic" id="rmn" title="Neues Puzzle">🖼️</button><button class="ic" id="rml" title="Raum verlassen">🚪</button></div><div id="rmp"></div></div>
<div id="ctx" hidden></div>
<div id="npn" hidden><div><h2 data-n="npt">🖼️ Neues Puzzle</h2><p data-n="nph">Startet ein neues Spiel für alle im Raum.</p><select id="npM"><option value="coop" data-n="m_coop">🤝 Zusammen</option><option value="race" data-n="m_race">🏁 Wettlauf</option><option disabled data-n="m_daily">📅 Daily (bald)</option><option disabled data-n="m_duel">⚔️ Duell (bald)</option></select><select id="npN"><option>48</option><option>100</option><option>250</option><option>500</option></select><select id="npI"><option value="" data-n="rnd">🎲 Zufallsbild</option></select><label class="bt">📷 Eigenes Foto <input type="file" id="npF" accept="image/*" hidden></label><div><button class="p" id="npG" data-n="go">Starten</button><button id="npX" data-n="cancel">Abbrechen</button></div></div></div>

const MS={ws:null,me:{n:0,tm:0},bot:{id:'bot',name:'Mia',av:'🐼',ac:'#4da3ff',col:1,n:0,tm:0},r:null,tm:0,

pl(){const r=this.r,a=[{id:'me',name:$('nm').value||'Gast',av:$('av').value,col:0,n:this.me.n,ac:avc,tm:this.me.tm,ld:r.lead==='me'}];if(!this.bot.gone)a.push({...this.bot,ld:r.lead==='bot'});return a},

msg(ws,m){this.ws=ws;
if(m.t==='create'||m.t==='join'){this.bot.gone=0;this.fresh(m,'coop');this.init();this.run();return}

const r=this.r;if(!r)return;
if(m.t==='new'){if(r.lead!=='me')return;this.fresh(m,m.mode==='race'?'race':'coop');this.init();this.run()}
else if(m.t==='full'&&!r.state)r.state=m.u;

run(){const r=this.r;this.stop();if(r.mode==='race'){const s=Math.round(r.n*.9+8);this.tm=setTimeout(()=>{if(this.r===r&&!this.bot.gone){this.bot.tm=s;this.out({t:'pl',p:this.pl()})}},s*1000);return}
